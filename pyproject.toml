[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "relu-tm"
version = "0.1.0"
description = "A fixed width-4 ReLU network that simulates any Turing machine, tested step by step"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Wurm" }]
requires-python = ">=3.10"
keywords = ["turing machine", "relu", "neural networks", "computability", "verification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
formats = ["pyyaml>=6", "defusedxml>=0.7"]  # turingmachine.io import; safer XML parsing for JFLAP
test = ["pytest>=7", "hypothesis>=6.80", "matplotlib>=3.7", "relu-tm[formats]"]
dev = ["relu-tm[test]", "ruff>=0.5"]
notebook = ["matplotlib>=3.7", "jupyterlab", "relu-tm[formats]"]

[project.scripts]
relu-tm = "relu_tm.cli:main"

[project.urls]
Source = "https://github.com/adrianwurm/relu-tm"
Paper = "https://neurips.cc/virtual/2026/poster/148965"
"Companion paper (FST/TCS 2026)" = "https://arxiv.org/abs/2610.06092"
"TM construction (MFCS 2025)" = "https://doi.org/10.4230/LIPIcs.MFCS.2025.29"

[tool.hatch.build.targets.wheel]
packages = ["src/relu_tm"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep the hand-aligned README examples

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Greek letters (β, σ, Γ) in docstrings are intended
    "E741",  # `l` (left tape register) is the notation of the paper
]

[tool.ruff.lint.isort]
known-first-party = ["relu_tm", "strategies"]
